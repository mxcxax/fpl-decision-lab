<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<title>Przekierowanie</title>
<script>
// spa-gh-pages: sciezke zamieniamy na zapytanie w korzeniu kopii.
var segmentow = 1;
var l = window.location;
l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + segmentow).join('/') + '/?/' +
  l.pathname.slice(1).split('/').slice(segmentow).join('/').replace(/&/g, '~and~') +
  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
</script></head><body></body></html>
